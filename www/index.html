<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoStVR v21 - Versión Android Optimizada</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            background: #000;
        }
        
        #camera-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        #controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 10;
            pointer-events: auto;
            max-width: 200px;
        }
        
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 10;
            pointer-events: auto;
        }
        
        button {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
            font-weight: bold;
            font-size: 12px;
            width: 100%;
            margin-bottom: 5px;
        }
        
        button:hover {
            background: #00cc6a;
        }
        
        .point-info {
            background: rgba(255,255,255,0.1);
            margin: 5px 0;
            padding: 5px;
            border-radius: 4px;
            font-size: 11px;
        }
        
        .boh-controls {
            display: flex;
            gap: 5px;
            margin: 5px 0;
        }
        
        .boh-controls button {
            flex: 1;
            margin: 0;
        }
    </style>
</head>
<body>
    <!-- Camera Overlay -->
    <div id="camera-overlay">
        <video id="camera-video" autoplay playsinline muted></video>
    </div>
    
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>
    
    <!-- Controls -->
    <div id="controls">
        <h3>🎯 GeoStVR v21</h3>
        <button onclick="startCamera()">📷 Iniciar Cámara</button>
        <button onclick="stopCamera()">⏹️ Detener Cámara</button>
        <button onclick="clearPoints()">🗑️ Limpiar Puntos</button>
        <button onclick="calculatePlane()">📐 Calcular Plano</button>
        
        <div class="boh-controls">
            <button onclick="moveBOH('yellow', 'up')">⬆️ Amarillo</button>
            <button onclick="moveBOH('yellow', 'down')">⬇️ Amarillo</button>
        </div>
        <div class="boh-controls">
            <button onclick="moveBOH('red', 'up')">⬆️ Rojo</button>
            <button onclick="moveBOH('red', 'down')">⬇️ Rojo</button>
        </div>
        <button onclick="measureAngle()">📐 Medir Ángulo</button>
        
        <div class="point-info">
            <strong>Puntos Seleccionados:</strong>
            <div id="points-display">Ninguno</div>
        </div>
        
        <div class="point-info">
            <strong>Instrucciones:</strong>
            <div>Toca la pantalla para seleccionar puntos</div>
        </div>
    </div>
    
    <!-- Status -->
    <div id="status">
        <div>Puntos: <span id="point-count">0</span>/3</div>
        <div>Estado: <span id="camera-status">Cámara no iniciada</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Variables globales
        let scene, camera, renderer;
        let cylinder, yellowBOH, redBOH;
        let selectedPoints = [];
        let pointMarkers = [];
        let cameraStream = null;
        let arActive = false;
        
        // Configuración técnica
        const CYLINDER_RADIUS = 6.5 / 2; // 6.5 cm / 2
        const CYLINDER_HEIGHT = 30; // 30 cm
        const BOH_HEIGHT = 15; // 15 cm cada BOH
        
        // Inicialización
        function init() {
            console.log("🚀 Iniciando GeoStVR v21 - Versión Android Optimizada...");
            
            // Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Cámara 3D - centrada en (0, 0, 15)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 15);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                preserveDrawingBuffer: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Crear elementos 3D
            createCoordinateSystem();
            createCylinder();
            createBOHs();
            
            // Eventos
            setupEvents();
            
            // Animación
            animate();
            
            console.log("✅ GeoStVR v21 inicializada");
        }
        
        // Crear sistema de coordenadas
        function createCoordinateSystem() {
            // Eje X (rojo)
            const xGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-10, 0, 0),
                new THREE.Vector3(10, 0, 0)
            ]);
            const xMaterial = new THREE.LineBasicMaterial({ color: 0xff0000 });
            const xAxis = new THREE.Line(xGeometry, xMaterial);
            scene.add(xAxis);
            
            // Eje Y (verde)
            const yGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, -10, 0),
                new THREE.Vector3(0, 10, 0)
            ]);
            const yMaterial = new THREE.LineBasicMaterial({ color: 0x00ff00 });
            const yAxis = new THREE.Line(yGeometry, yMaterial);
            scene.add(yAxis);
            
            // Eje Z (azul) - eje largo del cilindro
            const zGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, 35)
            ]);
            const zMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff });
            const zAxis = new THREE.Line(zGeometry, zMaterial);
            scene.add(zAxis);
            
            console.log("✅ Sistema de coordenadas creado");
        }
        
        // Crear cilindro transparente con solo contorno
        function createCylinder() {
            // Geometría del cilindro
            const geometry = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, CYLINDER_HEIGHT, 32);
            
            // Material transparente sin líneas de superficie
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x00ff88,
                transparent: true,
                opacity: 0.0, // Completamente transparente
                wireframe: false // Sin wireframe
            });
            
            cylinder = new THREE.Mesh(geometry, material);
            cylinder.position.set(0, 0, CYLINDER_HEIGHT / 2); // z=0 en la base
            scene.add(cylinder);
            
            // Crear líneas de contorno del cilindro
            createCylinderContour();
            
            console.log("✅ Cilindro transparente creado");
        }
        
        // Crear líneas de contorno del cilindro
        function createCylinderContour() {
            const segments = 32;
            const radius = CYLINDER_RADIUS;
            const height = CYLINDER_HEIGHT;
            
            // Línea de contorno inferior
            const bottomGeometry = new THREE.BufferGeometry();
            const bottomPoints = [];
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                bottomPoints.push(new THREE.Vector3(
                    radius * Math.cos(angle),
                    radius * Math.sin(angle),
                    0
                ));
            }
            bottomGeometry.setFromPoints(bottomPoints);
            const bottomMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88 });
            const bottomLine = new THREE.Line(bottomGeometry, bottomMaterial);
            scene.add(bottomLine);
            
            // Línea de contorno superior
            const topGeometry = new THREE.BufferGeometry();
            const topPoints = [];
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                topPoints.push(new THREE.Vector3(
                    radius * Math.cos(angle),
                    radius * Math.sin(angle),
                    height
                ));
            }
            topGeometry.setFromPoints(topPoints);
            const topMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88 });
            const topLine = new THREE.Line(topGeometry, topMaterial);
            scene.add(topLine);
            
            // Líneas verticales de contorno (4 líneas principales)
            const verticalLines = [
                { x: radius, y: 0 },      // Frente
                { x: -radius, y: 0 },     // Atrás
                { x: 0, y: radius },      // Derecha
                { x: 0, y: -radius }      // Izquierda
            ];
            
            verticalLines.forEach(pos => {
                const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(pos.x, pos.y, 0),
                    new THREE.Vector3(pos.x, pos.y, height)
                ]);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88 });
                const line = new THREE.Line(lineGeometry, lineMaterial);
                scene.add(line);
            });
        }
        
        // Crear BOHs
        function createBOHs() {
            // BOH Amarillo (z=0 a z=15)
            const yellowGeometry = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, BOH_HEIGHT, 32);
            const yellowMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffff00,
                transparent: true,
                opacity: 0.3
            });
            yellowBOH = new THREE.Mesh(yellowGeometry, yellowMaterial);
            yellowBOH.position.set(0, 0, BOH_HEIGHT / 2); // Centrado en z=7.5
            scene.add(yellowBOH);
            
            // BOH Rojo (z=15 a z=30)
            const redGeometry = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, BOH_HEIGHT, 32);
            const redMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xff0000,
                transparent: true,
                opacity: 0.3
            });
            redBOH = new THREE.Mesh(redGeometry, redMaterial);
            redBOH.position.set(0, 0, BOH_HEIGHT / 2 + BOH_HEIGHT); // Centrado en z=22.5
            scene.add(redBOH);
            
            console.log("✅ BOHs creados");
        }
        
        // Funciones de cámara
        async function startCamera() {
            try {
                // Configuración optimizada para Android
                const constraints = {
                    video: {
                        facingMode: 'environment', // Cámara trasera
                        width: { ideal: 1280, max: 1920 },
                        height: { ideal: 720, max: 1080 },
                        frameRate: { ideal: 30, max: 60 }
                    }
                };
                
                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                const videoElement = document.getElementById('camera-video');
                videoElement.srcObject = cameraStream;
                
                // Mostrar overlay de cámara
                document.getElementById('camera-overlay').style.display = 'block';
                
                // Configurar renderer para AR
                renderer.setClearColor(0x000000, 0);
                scene.background = null;
                
                arActive = true;
                document.getElementById('camera-status').textContent = 'Cámara activa';
                
                console.log("✅ Cámara iniciada en modo AR");
                
            } catch (error) {
                console.error("❌ Error al iniciar cámara:", error);
                document.getElementById('camera-status').textContent = 'Error: ' + error.message;
                alert("Error al acceder a la cámara: " + error.message);
            }
        }
        
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            
            // Ocultar overlay de cámara
            document.getElementById('camera-overlay').style.display = 'none';
            
            // Restaurar configuración normal
            renderer.setClearColor(0x000000, 1);
            scene.background = new THREE.Color(0x000000);
            
            arActive = false;
            document.getElementById('camera-status').textContent = 'Cámara detenida';
            
            console.log("✅ Cámara detenida");
        }
        
        // Mover BOHs rotacionalmente
        function moveBOH(bohType, direction) {
            const step = Math.PI / 18; // 10 grados por paso
            let boh = bohType === 'yellow' ? yellowBOH : redBOH;
            
            if (boh) {
                const currentRotation = boh.rotation.z;
                
                if (direction === 'up') {
                    boh.rotation.z = currentRotation + step;
                } else {
                    boh.rotation.z = currentRotation - step;
                }
                
                console.log(`BOH ${bohType} rotado ${direction} - Ángulo: ${(boh.rotation.z * 180 / Math.PI).toFixed(1)}°`);
            }
        }
        
        // Medir ángulo entre BOHs
        function measureAngle() {
            if (!yellowBOH || !redBOH) return;
            
            const yellowAngle = yellowBOH.rotation.z;
            const redAngle = redBOH.rotation.z;
            
            // Calcular diferencia de ángulos
            let angleDiff = Math.abs(redAngle - yellowAngle);
            
            // Normalizar a 0-360 grados
            if (angleDiff > Math.PI) {
                angleDiff = 2 * Math.PI - angleDiff;
            }
            
            const angleDegrees = angleDiff * (180 / Math.PI);
            
            const result = `
Ángulo entre BOHs: ${angleDegrees.toFixed(1)}°

Detalles:
- BOH Amarilla: ${(yellowAngle * 180 / Math.PI).toFixed(1)}°
- BOH Roja: ${(redAngle * 180 / Math.PI).toFixed(1)}°
- Diferencia: ${angleDiff.toFixed(3)} rad
            `;
            
            alert(result);
            console.log("📐 Medición de ángulo:", result);
        }
        
        // Eventos
        function setupEvents() {
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onMouseClick, false);
            renderer.domElement.addEventListener('touchstart', onTouchStart, false);
        }
        
        // Click para selección de puntos
        function onMouseClick(event) {
            event.preventDefault();
            handlePointSelection(event.clientX, event.clientY);
        }
        
        // Touch para selección de puntos (Android)
        function onTouchStart(event) {
            event.preventDefault();
            if (event.touches.length > 0) {
                const touch = event.touches[0];
                handlePointSelection(touch.clientX, touch.clientY);
            }
        }
        
        function handlePointSelection(clientX, clientY) {
            const mouse = new THREE.Vector2();
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            // Intentar intersectar con el cilindro
            const intersects = raycaster.intersectObject(cylinder);
            
            if (intersects.length > 0 && selectedPoints.length < 3) {
                const point = intersects[0].point;
                addPoint(point);
                console.log("✅ Punto seleccionado:", point);
            } else if (selectedPoints.length >= 3) {
                console.log("⚠️ Máximo 3 puntos permitidos");
            } else {
                console.log("❌ No se pudo seleccionar punto. Intenta hacer clic directamente en el cilindro.");
            }
        }
        
        // Agregar punto
        function addPoint(point) {
            selectedPoints.push(point);
            
            const markerGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const markerMaterial = new THREE.MeshBasicMaterial({ color: 0xff00ff });
            const marker = new THREE.Mesh(markerGeometry, markerMaterial);
            marker.position.copy(point);
            scene.add(marker);
            pointMarkers.push(marker);
            
            updatePointDisplay();
            
            if (selectedPoints.length === 3) {
                setTimeout(calculatePlane, 500);
            }
        }
        
        // Actualizar display
        function updatePointDisplay() {
            document.getElementById('point-count').textContent = selectedPoints.length;
            
            const pointsDisplay = document.getElementById('points-display');
            if (selectedPoints.length === 0) {
                pointsDisplay.textContent = 'Ninguno';
            } else {
                pointsDisplay.innerHTML = selectedPoints.map((point, index) => 
                    `P${index + 1}: (${point.x.toFixed(1)}, ${point.y.toFixed(1)}, ${point.z.toFixed(1)})`
                ).join('<br>');
            }
        }
        
        // Limpiar puntos
        function clearPoints() {
            selectedPoints = [];
            pointMarkers.forEach(marker => scene.remove(marker));
            pointMarkers = [];
            updatePointDisplay();
            console.log("✅ Puntos limpiados");
        }
        
        // Calcular plano y ángulos alfa/beta
        function calculatePlane() {
            if (selectedPoints.length !== 3) {
                alert("Se necesitan exactamente 3 puntos para calcular el plano");
                return;
            }
            
            const p1 = selectedPoints[0];
            const p2 = selectedPoints[1];
            const p3 = selectedPoints[2];
            
            const v1 = new THREE.Vector3().subVectors(p2, p1);
            const v2 = new THREE.Vector3().subVectors(p3, p1);
            
            const normal = new THREE.Vector3().crossVectors(v1, v2).normalize();
            
            // Alfa: ángulo entre el plano y el eje Z (0° = paralelo, 90° = perpendicular)
            const alpha = Math.asin(Math.abs(normal.z)) * (180 / Math.PI);
            
            // Beta: ángulo entre el plano y el BOH correspondiente
            const intersectionZ = calculatePlaneZIntersection(p1, normal);
            let beta = 0;
            let bohToUse = "Indefinido";
            
            if (intersectionZ !== null) {
                if (intersectionZ <= 15) {
                    // Usar BOH Amarillo (z=0 a z=15)
                    bohToUse = "Amarillo";
                    const yellowVector = new THREE.Vector3(0, 0, 1); // Vector del BOH amarillo
                    beta = Math.acos(Math.abs(normal.dot(yellowVector))) * (180 / Math.PI);
                } else {
                    // Usar BOH Rojo (z=15 a z=30)
                    bohToUse = "Rojo";
                    const redVector = new THREE.Vector3(0, 0, 1); // Vector del BOH rojo
                    beta = Math.acos(Math.abs(normal.dot(redVector))) * (180 / Math.PI);
                }
            }
            
            const result = `
Plano calculado:
Normal: (${normal.x.toFixed(3)}, ${normal.y.toFixed(3)}, ${normal.z.toFixed(3)})

Ángulos principales:
- Alfa (α): ${alpha.toFixed(1)}° (ángulo con eje Z)
- Beta (β): ${beta.toFixed(1)}° (ángulo con BOH ${bohToUse})

Intersección con eje Z: ${intersectionZ !== null ? `z = ${intersectionZ.toFixed(1)}` : 'Plano paralelo al eje Z'}
BOH para cálculo dinámico: ${bohToUse}

Puntos utilizados:
P1: (${p1.x.toFixed(2)}, ${p1.y.toFixed(2)}, ${p1.z.toFixed(2)})
P2: (${p2.x.toFixed(2)}, ${p2.y.toFixed(2)}, ${p2.z.toFixed(2)})
P3: (${p3.x.toFixed(2)}, ${p3.y.toFixed(2)}, ${p3.z.toFixed(2)})
            `;
            
            alert(result);
            console.log("📐 Cálculo de plano:", result);
        }
        
        // Calcular intersección del plano con el eje Z
        function calculatePlaneZIntersection(pointOnPlane, planeNormal) {
            const a = planeNormal.x;
            const b = planeNormal.y;
            const c = planeNormal.z;
            const d = -(a * pointOnPlane.x + b * pointOnPlane.y + c * pointOnPlane.z);
            
            if (Math.abs(c) < 0.0001) {
                return null;
            }
            
            return -d / c;
        }
        
        // Eventos de ventana
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Animación
        function animate() {
            requestAnimationFrame(animate);
            
            if (arActive) {
                // En modo AR, renderizar con fondo transparente
                renderer.setClearColor(0x000000, 0);
                renderer.render(scene, camera);
            } else {
                // Modo normal
                renderer.setClearColor(0x000000, 1);
                renderer.render(scene, camera);
            }
        }
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
