<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoStVR v35 - Versión Simplificada</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #00ffff;
        }
        
        .control-group {
            margin-bottom: 10px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #00ffff;
        }
        
        button {
            background: linear-gradient(45deg, #00ffff, #0088ff);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 2px;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: linear-gradient(45deg, #0088ff, #00ffff);
            transform: scale(1.05);
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #00ff88;
            font-size: 12px;
        }
        
        .point {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff0088;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .point:hover {
            transform: translate(-50%, -50%) scale(1.2);
            background: #ff4488;
        }
        
        .point.selected {
            background: #00ff88;
            border-color: #00ffff;
        }
        
        #reports-window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #00ffff;
            z-index: 20;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
        }
        
        .report-section {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 5px;
        }
        
        .report-title {
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 10px;
        }
        
        .report-item {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        
        .report-label {
            color: #00ff88;
        }
        
        .report-value {
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="camera-feed" autoplay muted></video>
        <div id="canvas-container"></div>
        
        <div id="controls">
            <div class="control-group">
                <label>🎥 Cámara</label>
                <button onclick="startCamera()">Iniciar Cámara</button>
                <button onclick="stopCamera()">Detener Cámara</button>
            </div>
            
            <div class="control-group">
                <label>📸 Captura</label>
                <button onclick="capturePhoto()">📸 Foto AR</button>
            </div>
            
            <div class="control-group">
                <label>📐 Mediciones</label>
                <button onclick="clearPoints()">🗑️ Limpiar</button>
                <button onclick="toggleReports()">📊 Datos</button>
            </div>
            
            <div class="control-group">
                <label>📤 Exportar</label>
                <button onclick="exportData()">📤 Exportar</button>
            </div>
        </div>
        
        <div class="status">
            <div id="camera-status">Cámara: Inactiva</div>
            <div id="photo-status">Foto AR: No capturada</div>
            <div id="points-status">Puntos: 0</div>
        </div>
        
        <div id="reports-window">
            <h4>📊 Reporte de Mediciones</h4>
            <button onclick="toggleReports()" style="float: right; font-size: 8px; padding: 2px 4px;">❌ Cerrar</button>
            
            <div class="report-section">
                <div class="report-title">Puntos Seleccionados</div>
                <div id="points-list">
                    <div class="report-item">
                        <span class="report-label">Total:</span>
                        <span class="report-value" id="total-points">0</span>
                    </div>
                </div>
            </div>
            
            <div class="report-section">
                <div class="report-title">Acciones</div>
                <button onclick="exportData()">📤 Exportar Datos</button>
                <button onclick="clearPoints()">🗑️ Limpiar Todo</button>
            </div>
        </div>
    </div>

    <script>
        // Variables globales simplificadas
        let scene, camera, renderer, canvas;
        let cameraStream = null;
        let isCameraActive = false;
        let selectedPoints = [];
        let pointElements = [];
        let reportsVisible = false;
        
        // Inicializar Three.js de forma simplificada
        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            
            // Crear escena
            scene = new THREE.Scene();
            
            // Crear cámara
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            
            // Crear renderer
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);
            
            // Crear cilindro simple
            const cylinderGeometry = new THREE.CylinderGeometry(3.25, 3.25, 10, 32);
            const cylinderMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ff88, 
                transparent: true, 
                opacity: 0.3,
                wireframe: true
            });
            const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
            scene.add(cylinder);
            
            // Animar
            animate();
        }
        
        // Función de animación simplificada
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        
        // Iniciar cámara de forma simplificada
        async function startCamera() {
            try {
                console.log("🎥 Iniciando cámara...");
                updateCameraStatus('Cámara: Iniciando...');
                
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };
                
                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                const videoElement = document.getElementById('camera-feed');
                videoElement.srcObject = cameraStream;
                
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    isCameraActive = true;
                    updateCameraStatus('Cámara: Activa');
                    console.log("✅ Cámara iniciada correctamente");
                };
                
            } catch (error) {
                console.error("❌ Error al iniciar cámara:", error);
                updateCameraStatus('Cámara: Error');
                alert("❌ Error al iniciar la cámara. Verifica los permisos.");
            }
        }
        
        // Detener cámara
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
                isCameraActive = false;
                updateCameraStatus('Cámara: Inactiva');
                console.log("🛑 Cámara detenida");
            }
        }
        
        // Capturar foto simplificada
        function capturePhoto() {
            if (!isCameraActive) {
                alert("❌ La cámara no está activa. Inicia la cámara primero.");
                return;
            }
            
            try {
                const video = document.getElementById('camera-feed');
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                
                const imageData = canvas.toDataURL('image/jpeg');
                console.log("✅ Foto AR capturada");
                updatePhotoStatus('Foto AR: Capturada ✅');
                
                // Habilitar selección de puntos
                enablePointSelection();
                
            } catch (error) {
                console.error("❌ Error al capturar foto:", error);
                alert("❌ Error al capturar la foto.");
            }
        }
        
        // Habilitar selección de puntos simplificada
        function enablePointSelection() {
            const container = document.getElementById('canvas-container');
            container.addEventListener('click', handlePointClick);
            console.log("✅ Selección de puntos habilitada");
        }
        
        // Manejar clic para seleccionar puntos
        function handlePointClick(event) {
            if (selectedPoints.length >= 10) {
                alert("❌ Máximo 10 puntos permitidos");
                return;
            }
            
            const rect = event.target.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            // Convertir coordenadas de pantalla a coordenadas 3D
            const mouse = new THREE.Vector2();
            mouse.x = (x / window.innerWidth) * 2 - 1;
            mouse.y = -(y / window.innerHeight) * 2 + 1;
            
            // Crear punto 3D en la superficie del cilindro
            const point3D = new THREE.Vector3();
            point3D.x = mouse.x * 3.25;
            point3D.y = mouse.y * 3.25;
            point3D.z = 0;
            
            // Agregar punto
            selectedPoints.push(point3D);
            
            // Crear elemento visual
            createPointElement(x, y, selectedPoints.length);
            
            // Actualizar estado
            updatePointsStatus();
            
            console.log(`✅ Punto ${selectedPoints.length} agregado:`, point3D);
        }
        
        // Crear elemento visual del punto
        function createPointElement(x, y, index) {
            const pointElement = document.createElement('div');
            pointElement.className = 'point';
            pointElement.style.left = x + 'px';
            pointElement.style.top = y + 'px';
            pointElement.textContent = index;
            pointElement.title = `Punto ${index}`;
            
            document.body.appendChild(pointElement);
            pointElements.push(pointElement);
        }
        
        // Limpiar puntos
        function clearPoints() {
            selectedPoints = [];
            pointElements.forEach(element => element.remove());
            pointElements = [];
            updatePointsStatus();
            console.log("🗑️ Puntos limpiados");
        }
        
        // Toggle de reportes
        function toggleReports() {
            const reportsWindow = document.getElementById('reports-window');
            reportsVisible = !reportsVisible;
            
            if (reportsVisible) {
                reportsWindow.style.display = 'block';
                updateReports();
            } else {
                reportsWindow.style.display = 'none';
            }
        }
        
        // Actualizar reportes
        function updateReports() {
            document.getElementById('total-points').textContent = selectedPoints.length;
            
            const pointsList = document.getElementById('points-list');
            pointsList.innerHTML = `
                <div class="report-item">
                    <span class="report-label">Total:</span>
                    <span class="report-value">${selectedPoints.length}</span>
                </div>
            `;
            
            selectedPoints.forEach((point, index) => {
                const pointDiv = document.createElement('div');
                pointDiv.className = 'report-item';
                pointDiv.innerHTML = `
                    <span class="report-label">Punto ${index + 1}:</span>
                    <span class="report-value">(${point.x.toFixed(2)}, ${point.y.toFixed(2)}, ${point.z.toFixed(2)})</span>
                `;
                pointsList.appendChild(pointDiv);
            });
        }
        
        // Exportar datos simplificados
        function exportData() {
            if (selectedPoints.length === 0) {
                alert("❌ No hay puntos para exportar");
                return;
            }
            
            try {
                // Crear datos CSV simples
                let csvContent = "Punto,X,Y,Z\n";
                selectedPoints.forEach((point, index) => {
                    csvContent += `${index + 1},${point.x.toFixed(3)},${point.y.toFixed(3)},${point.z.toFixed(3)}\n`;
                });
                
                // Crear y descargar archivo
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `GeoStVR_Puntos_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.csv`;
                link.click();
                
                console.log("✅ Datos exportados exitosamente");
                alert("✅ Datos exportados exitosamente");
                
            } catch (error) {
                console.error("❌ Error al exportar datos:", error);
                alert("❌ Error al exportar datos");
            }
        }
        
        // Funciones de actualización de estado
        function updateCameraStatus(status) {
            document.getElementById('camera-status').textContent = status;
        }
        
        function updatePhotoStatus(status) {
            document.getElementById('photo-status').textContent = status;
        }
        
        function updatePointsStatus() {
            document.getElementById('points-status').textContent = `Puntos: ${selectedPoints.length}`;
        }
        
        // Manejar redimensionamiento
        window.addEventListener('resize', () => {
            if (renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
        
        // Inicializar aplicación
        document.addEventListener('DOMContentLoaded', () => {
            console.log("🚀 GeoStVR v35 - Versión Simplificada iniciando...");
            initThreeJS();
            console.log("✅ Aplicación iniciada correctamente");
        });
    </script>
</body>
</html>
