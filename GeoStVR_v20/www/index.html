<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoStVR v20 - Geometría Virtual</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            background: #000;
        }
        
        #camera-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        #controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 10;
            pointer-events: auto;
        }
        
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 10;
            pointer-events: auto;
        }
        
        button {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
            font-weight: bold;
        }
        
        button:hover {
            background: #00cc6a;
        }
        
        .point-info {
            background: rgba(255,255,255,0.1);
            margin: 5px 0;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Camera Overlay -->
    <div id="camera-overlay">
        <video id="camera-video" autoplay playsinline muted></video>
    </div>
    
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>
    
    <!-- Controls -->
    <div id="controls">
        <h3>🎯 GeoStVR v20</h3>
        <button onclick="startCamera()">📷 Iniciar Cámara</button>
        <button onclick="stopCamera()">⏹️ Detener Cámara</button>
        <button onclick="clearPoints()">🗑️ Limpiar Puntos</button>
        <button onclick="calculatePlane()">📐 Calcular Plano</button>
        
        <div class="point-info">
            <strong>Puntos Seleccionados:</strong>
            <div id="points-display">Ninguno</div>
        </div>
        
        <div class="point-info">
            <strong>Instrucciones:</strong>
            <div>Toca la pantalla para seleccionar puntos</div>
        </div>
    </div>
    
    <!-- Status -->
    <div id="status">
        <div>Puntos: <span id="point-count">0</span>/3</div>
        <div>Estado: <span id="camera-status">Cámara no iniciada</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Variables globales
        let scene, camera, renderer;
        let cylinder, yellowBOH, redBOH;
        let selectedPoints = [];
        let pointMarkers = [];
        let cameraStream = null;
        
        // Configuración técnica
        const CYLINDER_RADIUS = 6.5 / 2; // 6.5 cm / 2
        const CYLINDER_HEIGHT = 30; // 30 cm
        const BOH_HEIGHT = 15; // 15 cm cada BOH
        
        // Inicialización
        function init() {
            console.log("🚀 Iniciando GeoStVR v20...");
            
            // Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Cámara 3D - centrada en (0, 0, 15)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 15);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                preserveDrawingBuffer: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Crear elementos 3D
            createCoordinateSystem();
            createCylinder();
            createBOHs();
            
            // Eventos
            setupEvents();
            
            // Animación
            animate();
            
            console.log("✅ GeoStVR v20 inicializada");
        }
        
        // Crear sistema de coordenadas
        function createCoordinateSystem() {
            // Eje X (rojo)
            const xGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-10, 0, 0),
                new THREE.Vector3(10, 0, 0)
            ]);
            const xMaterial = new THREE.LineBasicMaterial({ color: 0xff0000 });
            const xAxis = new THREE.Line(xGeometry, xMaterial);
            scene.add(xAxis);
            
            // Eje Y (verde)
            const yGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, -10, 0),
                new THREE.Vector3(0, 10, 0)
            ]);
            const yMaterial = new THREE.LineBasicMaterial({ color: 0x00ff00 });
            const yAxis = new THREE.Line(yGeometry, yMaterial);
            scene.add(yAxis);
            
            // Eje Z (azul) - eje largo del cilindro
            const zGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, 35)
            ]);
            const zMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff });
            const zAxis = new THREE.Line(zGeometry, zMaterial);
            scene.add(zAxis);
            
            console.log("✅ Sistema de coordenadas creado");
        }
        
        // Crear cilindro transparente con solo contorno
        function createCylinder() {
            // Geometría del cilindro
            const geometry = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, CYLINDER_HEIGHT, 32);
            
            // Material transparente sin líneas de superficie
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x00ff88,
                transparent: true,
                opacity: 0.0, // Completamente transparente
                wireframe: false // Sin wireframe
            });
            
            cylinder = new THREE.Mesh(geometry, material);
            cylinder.position.set(0, 0, CYLINDER_HEIGHT / 2); // z=0 en la base
            scene.add(cylinder);
            
            // Crear líneas de contorno del cilindro
            createCylinderContour();
            
            console.log("✅ Cilindro transparente creado");
        }
        
        // Crear líneas de contorno del cilindro
        function createCylinderContour() {
            const segments = 32;
            const radius = CYLINDER_RADIUS;
            const height = CYLINDER_HEIGHT;
            
            // Línea de contorno inferior
            const bottomGeometry = new THREE.BufferGeometry();
            const bottomPoints = [];
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                bottomPoints.push(new THREE.Vector3(
                    radius * Math.cos(angle),
                    radius * Math.sin(angle),
                    0
                ));
            }
            bottomGeometry.setFromPoints(bottomPoints);
            const bottomMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88 });
            const bottomLine = new THREE.Line(bottomGeometry, bottomMaterial);
            scene.add(bottomLine);
            
            // Línea de contorno superior
            const topGeometry = new THREE.BufferGeometry();
            const topPoints = [];
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                topPoints.push(new THREE.Vector3(
                    radius * Math.cos(angle),
                    radius * Math.sin(angle),
                    height
                ));
            }
            topGeometry.setFromPoints(topPoints);
            const topMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88 });
            const topLine = new THREE.Line(topGeometry, topMaterial);
            scene.add(topLine);
            
            // Líneas verticales de contorno (4 líneas principales)
            const verticalLines = [
                { x: radius, y: 0 },      // Frente
                { x: -radius, y: 0 },     // Atrás
                { x: 0, y: radius },      // Derecha
                { x: 0, y: -radius }      // Izquierda
            ];
            
            verticalLines.forEach(pos => {
                const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(pos.x, pos.y, 0),
                    new THREE.Vector3(pos.x, pos.y, height)
                ]);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88 });
                const line = new THREE.Line(lineGeometry, lineMaterial);
                scene.add(line);
            });
        }
        
        // Crear BOHs
        function createBOHs() {
            // BOH Amarillo (z=0 a z=15)
            const yellowGeometry = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, BOH_HEIGHT, 32);
            const yellowMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffff00,
                transparent: true,
                opacity: 0.3
            });
            yellowBOH = new THREE.Mesh(yellowGeometry, yellowMaterial);
            yellowBOH.position.set(0, 0, BOH_HEIGHT / 2); // Centrado en z=7.5
            scene.add(yellowBOH);
            
            // BOH Rojo (z=15 a z=30)
            const redGeometry = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, BOH_HEIGHT, 32);
            const redMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xff0000,
                transparent: true,
                opacity: 0.3
            });
            redBOH = new THREE.Mesh(redGeometry, redMaterial);
            redBOH.position.set(0, 0, BOH_HEIGHT / 2 + BOH_HEIGHT); // Centrado en z=22.5
            scene.add(redBOH);
            
            console.log("✅ BOHs creados: Amarillo (z=0-15), Rojo (z=15-30)");
        }
        
        // Configurar eventos
        function setupEvents() {
            window.addEventListener('resize', onWindowResize);
            
            // Evento de toque para selección de puntos
            renderer.domElement.addEventListener('touchstart', onTouchStart, false);
            renderer.domElement.addEventListener('click', onMouseClick, false);
        }
        
        // Evento de toque
        function onTouchStart(event) {
            event.preventDefault();
            const touch = event.touches[0];
            handlePointSelection(touch.clientX, touch.clientY);
        }
        
        // Evento de clic
        function onMouseClick(event) {
            handlePointSelection(event.clientX, event.clientY);
        }
        
        // Manejar selección de puntos
        function handlePointSelection(clientX, clientY) {
            if (selectedPoints.length >= 3) {
                alert("Ya tienes 3 puntos seleccionados. Limpia los puntos para seleccionar nuevos.");
                return;
            }
            
            // Convertir coordenadas de pantalla a coordenadas 3D
            const mouse = new THREE.Vector2();
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            // Raycaster para detectar intersección con el cilindro
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            // Calcular punto en la superficie del cilindro
            const cylinderPoint = calculateCylinderPoint(mouse);
            
            if (cylinderPoint) {
                addPoint(cylinderPoint);
            }
        }
        
        // Calcular punto en la superficie del cilindro
        function calculateCylinderPoint(mouse) {
            // Proyectar rayo desde la cámara
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            // Calcular intersección con el cilindro
            const cylinderGeometry = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, CYLINDER_HEIGHT, 32);
            const cylinderMesh = new THREE.Mesh(cylinderGeometry);
            cylinderMesh.position.set(0, 0, CYLINDER_HEIGHT / 2);
            
            const intersects = raycaster.intersectObject(cylinderMesh);
            
            if (intersects.length > 0) {
                return intersects[0].point;
            }
            
            return null;
        }
        
        // Agregar punto seleccionado
        function addPoint(point) {
            selectedPoints.push(point);
            
            // Crear marcador visual
            const markerGeometry = new THREE.SphereGeometry(0.2, 16, 16);
            const markerMaterial = new THREE.MeshBasicMaterial({ color: 0xff00ff });
            const marker = new THREE.Mesh(markerGeometry, markerMaterial);
            marker.position.copy(point);
            scene.add(marker);
            pointMarkers.push(marker);
            
            // Actualizar interfaz
            updatePointDisplay();
            
            console.log(`Punto ${selectedPoints.length} agregado en:`, point);
        }
        
        // Actualizar display de puntos
        function updatePointDisplay() {
            document.getElementById('point-count').textContent = selectedPoints.length;
            
            let pointsText = '';
            selectedPoints.forEach((point, index) => {
                pointsText += `P${index + 1}: (${point.x.toFixed(1)}, ${point.y.toFixed(1)}, ${point.z.toFixed(1)})<br>`;
            });
            
            document.getElementById('points-display').innerHTML = pointsText || 'Ninguno';
        }
        
        // Limpiar puntos
        function clearPoints() {
            selectedPoints = [];
            
            // Remover marcadores
            pointMarkers.forEach(marker => {
                scene.remove(marker);
            });
            pointMarkers = [];
            
            updatePointDisplay();
            console.log("Puntos limpiados");
        }
        
        // Calcular plano
        function calculatePlane() {
            if (selectedPoints.length !== 3) {
                alert("Necesitas seleccionar exactamente 3 puntos para calcular el plano.");
                return;
            }
            
            const p1 = selectedPoints[0];
            const p2 = selectedPoints[1];
            const p3 = selectedPoints[2];
            
            // Calcular vectores del plano
            const v1 = new THREE.Vector3().subVectors(p2, p1);
            const v2 = new THREE.Vector3().subVectors(p3, p1);
            
            // Calcular normal del plano
            const normal = new THREE.Vector3().crossVectors(v1, v2).normalize();
            
            // Calcular ángulos con los ejes
            const angleX = Math.acos(Math.abs(normal.x)) * (180 / Math.PI);
            const angleY = Math.acos(Math.abs(normal.y)) * (180 / Math.PI);
            const angleZ = Math.acos(Math.abs(normal.z)) * (180 / Math.PI);
            
            const result = `
Plano calculado:
Normal: (${normal.x.toFixed(3)}, ${normal.y.toFixed(3)}, ${normal.z.toFixed(3)})
Ángulos con ejes:
- Eje X: ${angleX.toFixed(1)}°
- Eje Y: ${angleY.toFixed(1)}°
- Eje Z: ${angleZ.toFixed(1)}°
            `;
            
            alert(result);
            console.log("Plano calculado:", result);
        }
        
        // Funciones de cámara
        async function startCamera() {
            try {
                const constraints = {
                    video: {
                        width: { ideal: window.innerWidth },
                        height: { ideal: window.innerHeight },
                        facingMode: 'environment'
                    }
                };
                
                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                const videoElement = document.getElementById('camera-video');
                videoElement.srcObject = cameraStream;
                
                document.getElementById('camera-status').textContent = 'Cámara activa';
                console.log("✅ Cámara iniciada");
            } catch (error) {
                console.error("❌ Error al iniciar cámara:", error);
                document.getElementById('camera-status').textContent = 'Error: ' + error.message;
            }
        }
        
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
                
                const videoElement = document.getElementById('camera-video');
                videoElement.srcObject = null;
                
                document.getElementById('camera-status').textContent = 'Cámara detenida';
                console.log("✅ Cámara detenida");
            }
        }
        
        // Eventos de ventana
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Animación
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        
        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
